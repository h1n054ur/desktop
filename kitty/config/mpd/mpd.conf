# Per-user MPD for rmpc (systemctl --user, not the system service)
music_directory     "~/Music"
playlist_directory  "~/.local/state/mpd/playlists"
db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

# rmpc needs the unix socket for YouTube (it adds downloaded files as file:// URIs)
bind_to_address     "~/.local/state/mpd/socket"
bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
replaygain          "auto"

# Sound: PipeWire through its PulseAudio server (pipewire-pulse)
audio_output {
    type    "pulse"
    name    "PipeWire"
}

# Raw samples for the cava visualizer
audio_output {
    type    "fifo"
    name    "cava"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
