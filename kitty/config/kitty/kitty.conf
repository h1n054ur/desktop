# Look: CachyOS's kitty defaults (see-through, roomy padding, cursor trail) and Noctalia's colours, which follow the
# desktop palette. Noctalia writes themes/noctalia.conf, keeps the include line below and reloads kitty on change.
background_opacity    0.85
cursor_trail          1
window_padding_width  25
# Text and ANSI colours as before (Catppuccin Mocha), over Noctalia; must come after the Noctalia include
include ansi.conf

# Font
font_family        CaskaydiaCove Nerd Font Mono
font_size          11.5
disable_ligatures  never
modify_font        cell_height 115%

# Symbols Claude Code and other TUIs draw (connectors, media dots, markers):
# keep them monochrome and in the terminal's colour instead of emoji fallback
symbol_map U+23BF                   Noto Sans Symbols
symbol_map U+23F4-U+23FA            Noto Sans Symbols2
symbol_map U+29C9,U+29D7            Noto Sans Math

# Splits
enabled_layouts          splits,stack
window_border_width      1.5pt
window_margin_width      2
inactive_text_alpha      0.75

# Misc
confirm_os_window_close 0
scrollback_lines     20000
enable_audio_bell    no
copy_on_select       clipboard
strip_trailing_spaces smart
shell_integration    enabled

# Keys
# Ctrl+V and right click paste through smart_paste.py (screenshots go to the program, e.g. Claude Code; files copied in
# Dolphin paste as paths; text pastes as usual), Ctrl+C copies when text is selected (otherwise it still interrupts).
# Ctrl+Shift+C/V keep working too.
map ctrl+v           kitten smart_paste.py
map ctrl+c           copy_or_interrupt
mouse_map right press ungrabbed kitten smart_paste.py
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+d     detach_tab new
map ctrl+shift+z     toggle_layout stack
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+y     launch --type=tab --cwd=current --tab-title=yazi yazi
map ctrl+shift+m     launch --type=tab --tab-title=music rmpc

# Remote control so the Noctalia Claude Sessions widget can jump to the exact tab/split
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
include themes/noctalia.conf
