[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = false

[preview]
max_width  = 1600
max_height = 1600

# Open files with the desktop's default apps (xdg-open), reveal them in Dolphin
[opener]
edit = [
	{ run = "${EDITOR:-vim} %s", desc = "vim",     for = "unix", block = true },
	{ run = "code %s",           desc = "VS Code", for = "unix", orphan = true },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]
play = [
	{ run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
]
reveal = [
	{ run = "dolphin --select %s1", desc = "Show in Dolphin", for = "linux", orphan = true },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
