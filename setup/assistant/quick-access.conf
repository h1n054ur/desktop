# Super+Space assistant panel (kitten quick-access-terminal). Uses kitty.conf as is, so it carries the h1n054ur look
# (Noctalia background and borders, Catppuccin text, CaskaydiaCove), shaped as a floating card under the bar like the
# Noctalia dropdowns. Opens on the focused screen.
edge top
lines 18
margin_top 12
margin_left 420
margin_right 420
background_opacity 0.96
hide_on_focus_loss no
kitty_override window_padding_width=16
kitty_override cursor_trail=0
