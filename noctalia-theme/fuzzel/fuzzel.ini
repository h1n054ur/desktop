# h1n054ur look for fuzzel, the app launcher on Super+` (matches the Noctalia launcher: dark card,
# green selected row, cyan matches, CaskaydiaCove Nerd Font Mono). Colours are RRGGBBAA.

[main]
font=CaskaydiaCove Nerd Font Mono:size=12
use-bold=yes
prompt=""
placeholder=Search applications…
icon-theme=breeze-dark
icons-enabled=yes
match-mode=fzf
sort-result=yes
fields=filename,name,generic,keywords
terminal=kitty -e
# Apps start as their own UWSM units, like the Hyprland binds (leave empty without UWSM)
launch-prefix=uwsm app --
anchor=center
lines=12
width=40
horizontal-pad=16
vertical-pad=14
inner-pad=10
line-height=30
image-size-ratio=0.5
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=06090af5
text=e6f1eeff
prompt=00e5ffff
placeholder=9fb2acff
input=e6f1eeff
match=00e5ffff
selection=39ff14ff
selection-text=06090aff
selection-match=06090aff
counter=9fb2acff
border=1d2a26ff

[border]
width=1
radius=10
