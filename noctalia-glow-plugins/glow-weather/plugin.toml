id          = "hani/glow-weather"
name        = "Glow Weather"
version     = "0.1.0"
plugin_api  = 32
author      = "hani"
license     = "MIT"
icon        = "cloud"
description = "Glow-icon weather: feels-like temperature, 12-hour sparkline and air quality on the bar; hourly graph, 7-day forecast, AQI, UV and sun times in a panel. Data from Open-Meteo."
tags        = ["bar", "weather", "panel", "service"]

[[setting]]
key             = "refresh_minutes"
type            = "int"
label_key       = "settings.refresh.label"
description_key = "settings.refresh.description"
default         = 15
min             = 5
max             = 120

[[setting]]
key             = "latitude"
type            = "double"
label_key       = "settings.latitude.label"
description_key = "settings.coords.description"
default         = 0.0
advanced        = true

[[setting]]
key             = "longitude"
type            = "double"
label_key       = "settings.longitude.label"
description_key = "settings.coords.description"
default         = 0.0
advanced        = true

[[service]]
id    = "data"
entry = "service.luau"

[[widget]]
id    = "bar"
entry = "bar.luau"

  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key       = "temperature"
  type      = "select"
  label_key = "settings.temperature.label"
  default   = "actual"
  options   = [ { value = "feels", label_key = "settings.temperature.feels" }, { value = "actual", label_key = "settings.temperature.actual" } ]

  [[widget.setting]]
  key       = "sparkline"
  type      = "select"
  label_key = "settings.sparkline.label"
  default   = "temp"
  options   = [ { value = "temp", label_key = "settings.sparkline.temp" }, { value = "rain", label_key = "settings.sparkline.rain" }, { value = "off", label_key = "settings.sparkline.off" } ]

  [[widget.setting]]
  key       = "show_condition"
  type      = "bool"
  label_key = "settings.show_condition.label"
  default   = true

  [[widget.setting]]
  key       = "show_aqi"
  type      = "bool"
  label_key = "settings.show_aqi.label"
  default   = true

[[panel]]
id                       = "panel"
entry                    = "panel.luau"
width                    = 540
height                   = 790
placement                = "floating"
position                 = "auto"
open_near_click          = true
dismiss_on_outside_click = true
